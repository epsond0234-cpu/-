name: Kakao Token Exchange

on:
  workflow_dispatch:
    inputs:
      code:
        description: 'Kakao OAuth authorization code'
        required: true

jobs:
  exchange:
    runs-on: ubuntu-latest
    steps:
      - name: Exchange code for tokens
        run: |
          curl -sS -X POST "https://kauth.kakao.com/oauth/token" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "grant_type=authorization_code" \
            -d "client_id=c55b9287412361db3c7ef7bdf3925960" \
            -d "client_secret=RmWLZIABN9irmHa442bnongyUZgeqI8i" \
            -d "redirect_uri=https://developers.kakao.com/tool/redirect" \
            -d "code=${{ github.event.inputs.code }}"
